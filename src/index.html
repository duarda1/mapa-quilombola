<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Quilombola - Interface</title>

  <!-- Tailwind CSS (Estilização) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS (Estrutura Visual do Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    #map { height: 320px; z-index: 1; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

  <!-- CABEÇALHO / HEADER -->
  <header class="bg-emerald-800 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">📍 Sistema Mapa Quilombola</h1>
      <span class="text-xs bg-emerald-900 px-3 py-1 rounded-full border border-emerald-700">Interface Pronta</span>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (LAYOUT GRID) -->
  <main class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">

    <!-- COLUNA 1: FORMULÁRIO DE CADASTRO -->
    <section class="lg:col-span-4 bg-white p-5 rounded-xl shadow-sm border border-gray-200 h-fit">
      <h2 class="text-lg font-bold mb-4 text-emerald-800 border-b pb-2">Cadastrar Comunidade</h2>
      
      <form id="formComunidade" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nome da Comunidade</label>
          <input type="text" id="nome" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Digite o nome...">
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Município</label>
            <input type="text" id="municipio" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">UF</label>
            <input type="text" id="estado" maxlength="2" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none uppercase" placeholder="EX: MA">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
            <input type="number" step="any" id="lat" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Ex: -2.53">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
            <input type="number" step="any" id="lng" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Ex: -44.30">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nº de Famílias</label>
          <input type="number" id="familias" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0">
        </div>

        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg transition shadow">
          Salvar
        </button>
      </form>
    </section>

    <!-- COLUNA 2: MAPA E TABELA -->
    <section class="lg:col-span-8 space-y-6">
      
      <!-- CONTÊINER DO MAPA -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
        <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Localização no Mapa</h2>
        <div id="map" class="rounded-lg"></div>
      </div>

      <!-- TABELA DE DADOS (VAZIA) -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <h2 class="text-lg font-bold mb-4 text-emerald-800 border-b pb-2">Comunidades Cadastradas</h2>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase border-b">
                <th class="p-3">Nome</th>
                <th class="p-3">Município / UF</th>
                <th class="p-3 text-center">Famílias</th>
                <th class="p-3 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaCorpo" class="divide-y divide-gray-100 text-sm">
              <!-- Linhas da tabela serão inseridas via JS quando houver dados -->
            </tbody>
          </table>

          <!-- Estado Vazio (Mensagem padrão quando não há dados) -->
          <div id="mensagemVazio" class="text-center py-8 text-gray-400">
            <p>Nenhuma comunidade cadastrada até o momento.</p>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- Leaflet JS (Renderização do Mapa) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. INICIALIZAÇÃO APENAS DA CASCA DO MAPA
    // Ponto central padrão (Maranhão)
    const map = L.map('map').setView([-2.53, -44.30], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. ESTRUTURA DAS FUNÇÕES (PRONTAS PARA RECEBER O BACKEND / API FUTURAMENTE)

    // Função para buscar/listar os dados no futuro
    async function carregarComunidades() {
      // TODO: Adicionar o fetch('http://sua-api.com/comunidades') aqui no futuro
      console.log("Casca pronta: aguardando rota de leitura (GET)...");
    }

    // Evento de envio do formulário
    document.getElementById('formComunidade').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Captura dos dados inseridos no form
      const dadosFormulario = {
        nome: document.getElementById('nome').value,
        municipio: document.getElementById('municipio').value,
        estado: document.getElementById('estado').value,
        lat: parseFloat(document.getElementById('lat').value),
        lng: parseFloat(document.getElementById('lng').value),
        familias: parseInt(document.getElementById('familias').value)
      };

      console.log("Dados prontos para envio:", dadosFormulario);
      // TODO: Adicionar o fetch('http://sua-api.com/comunidades', { method: 'POST', body: ... }) aqui no futuro
      
      alert("Formulário enviado! (Aguardando integração com o banco)");
    });

    // Função para excluir no futuro
    function deletarComunidade(id) {
      console.log("Pronto para excluir o ID:", id);
      // TODO: Adicionar o fetch para deletar no futuro
    }

    // Executa a função ao carregar a página
    carregarComunidades();
  </script>
</body>
</html>
